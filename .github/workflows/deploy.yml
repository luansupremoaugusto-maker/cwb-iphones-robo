name: Deploy VPS

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy tested commit to VPS
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/cwb_iphones_actions"
          chmod 600 "$HOME/.ssh/cwb_iphones_actions"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy the tested commit
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/cwb_iphones_actions" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/cwb-iphones
          git fetch origin main
          test -z "$(git status --porcelain --untracked-files=no)"
          latest_main_sha="$(git rev-parse origin/main)"
          if [[ "$DEPLOY_SHA" != "$latest_main_sha" ]]; then
            echo "Skipping stale Tests result $DEPLOY_SHA; current main is $latest_main_sha"
            exit 0
          fi
          git checkout --detach "$DEPLOY_SHA"

          docker compose --env-file .env.local config --quiet
          git fetch origin main
          latest_main_sha="$(git rev-parse origin/main)"
          if [[ "$DEPLOY_SHA" != "$latest_main_sha" ]]; then
            echo "Skipping stale deployment $DEPLOY_SHA; current main is $latest_main_sha"
            exit 0
          fi
          docker compose --env-file .env.local up -d --build
          docker compose --env-file .env.local ps
          curl -fsS https://bot.cwbiphones.cloud/ready
          REMOTE
