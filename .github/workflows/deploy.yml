name: Deploy VPS

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy tested commit to VPS
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/cwb_iphones_actions"
          chmod 600 "$HOME/.ssh/cwb_iphones_actions"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy the tested commit
        shell: bash
        run: |
          set -euo pipefail
          # Buffer the heredoc first; docker compose exec must not consume the remaining script.
          ssh \
            -i "$HOME/.ssh/cwb_iphones_actions" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -c 'script=\$(cat); bash -c \"\$script\" </dev/null'" <<'REMOTE'
          set -euo pipefail

          cd /opt/cwb-iphones
          git fetch origin main
          test -z "$(git status --porcelain --untracked-files=no)"
          latest_main_sha="$(git rev-parse origin/main)"
          if [[ "$DEPLOY_SHA" != "$latest_main_sha" ]]; then
            echo "Skipping stale Tests result $DEPLOY_SHA; current main is $latest_main_sha"
            exit 0
          fi
          git checkout --detach "$DEPLOY_SHA"
          active_vps_sha="$(git rev-parse HEAD)"
          test "$active_vps_sha" = "$DEPLOY_SHA"
          printf 'Active VPS SHA: %s\n' "$active_vps_sha"

          if grep -q '^OPENAI_MODEL=' .env.local; then
            sed -i 's/^OPENAI_MODEL=.*/OPENAI_MODEL=gpt-6-luna/' .env.local
          else
            printf '\nOPENAI_MODEL=gpt-6-luna\n' >> .env.local
          fi

          if grep -q '^OPENAI_REASONING_EFFORT=' .env.local; then
            sed -i 's/^OPENAI_REASONING_EFFORT=.*/OPENAI_REASONING_EFFORT=medium/' .env.local
          else
            printf '\nOPENAI_REASONING_EFFORT=medium\n' >> .env.local
          fi

          docker compose --env-file .env.local config --quiet
          git fetch origin main
          latest_main_sha="$(git rev-parse origin/main)"
          if [[ "$DEPLOY_SHA" != "$latest_main_sha" ]]; then
            echo "Skipping stale deployment $DEPLOY_SHA; current main is $latest_main_sha"
            exit 0
          fi
          docker compose --env-file .env.local up -d --build
          docker compose --env-file .env.local ps
          docker compose --env-file .env.local exec -T app python - <<'PY'
          import asyncio
          import time
          from app.adapters.catalog_cache import StoreCatalogCache
          from app.agent import AgentService
          from app.config import Settings
          from app.faq import FAQStore
          from app.schemas import InventoryItem

          class EmptyMercadoClient:
              async def fetch_all_inventory(self):
                  return []

          class EmptySealedCatalog:
              items = []

              async def ensure_fresh(self):
                  return None

              async def search(self, query, limit=5):
                  return []

              async def get(self, product_id):
                  return None

          settings = Settings(google_sheets_enabled=True)
          cache = StoreCatalogCache(
              EmptyMercadoClient(),
              settings,
              cache_path="/tmp/new-models-list-guard.json",
              sealed_cache=EmptySealedCatalog(),
          )
          cache.items = [
              InventoryItem(
                  external_id="iphone-16-pro-max-used",
                  name="iPhone 16 Pro Max",
                  category="Celular",
                  capacity="256 GB",
                  color="PRETO",
                  source="mercado_phone",
                  condition="SEMINOVO",
                  availability="Disponível para venda",
                  quantity=1,
                  price_brl=5170,
                  battery_health=89,
                  search_text="iphone 16 pro max 256 gb preto celular seminovo",
              )
          ]
          cache.last_refresh = time.time()
          service = AgentService(cache, FAQStore(settings.faq_file), settings, offline=True)
          history = [
              {"role": "user", "content": "Quais opções de iPhone 16 Pro Max seminovo?"},
              {
                  "role": "assistant",
                  "content": "iPhone 16 Pro Max 256 GB seminovo por R$ 5.170,00, bateria 89%.",
              },
          ]
          decision = asyncio.run(
              service.respond("E os modelos novos disponíveis?", history=history)
          )
          assert not decision.handoff, decision
          assert decision.product_references == [], decision
          assert decision.image_urls == [], decision
          assert "modelos novos/lacrados" in decision.reply.lower(), decision.reply
          assert "seminovo" not in decision.reply.lower(), decision.reply
          assert "iphone 16 pro max" not in decision.reply.lower(), decision.reply
          print("NEW_MODELS_LIST_EXCLUDES_SEMINOVOS_OK")

          ipad_sealed = EmptySealedCatalog()
          ipad_sealed.items = [
              InventoryItem(
                  external_id="sheet:ipad-11-128",
                  name="iPad 11 A16",
                  category="Novo lacrado",
                  capacity="128 GB",
                  source="google_sheets",
                  condition="novo lacrado",
                  availability="Preço confirmado",
                  price_brl=3100,
                  search_text="ipad 11 a16 128 gb novo lacrado",
              ),
              InventoryItem(
                  external_id="sheet:iphone-16-128",
                  name="iPhone 16",
                  category="Novo lacrado",
                  capacity="128 GB",
                  source="google_sheets",
                  condition="novo lacrado",
                  availability="Preço confirmado",
                  price_brl=4600,
                  search_text="iphone 16 128 gb novo lacrado",
              ),
          ]
          ipad_cache = StoreCatalogCache(
              EmptyMercadoClient(),
              settings,
              cache_path="/tmp/ipad-seminovo-new-options-guard.json",
              sealed_cache=ipad_sealed,
          )
          ipad_cache.items = [
              InventoryItem(
                  external_id="iphone-13-pro-used",
                  name="iPhone 13 Pro",
                  category="Celular",
                  capacity="128 GB",
                  color="ROSA",
                  source="mercado_phone",
                  condition="SEMINOVO",
                  availability="Disponível para venda",
                  quantity=1,
                  price_brl=2390,
                  battery_health=88,
                  search_text="iphone 13 pro 128 gb rosa celular seminovo",
              ),
              InventoryItem(
                  external_id="ipad-10-ready",
                  name="iPad 10",
                  category="Celular",
                  capacity="64 GB",
                  color="AZUL",
                  source="mercado_phone",
                  condition="LACRADO",
                  availability="Disponível para venda",
                  quantity=1,
                  price_brl=2200,
                  search_text="ipad 10 64 gb azul lacrado",
              ),
          ]
          ipad_cache.last_refresh = time.time()
          ipad_service = AgentService(
              ipad_cache,
              FAQStore(settings.faq_file),
              settings,
              offline=True,
          )
          ipad_history = [
              {"role": "user", "content": "Boa noite"},
              {"role": "assistant", "content": "Boa noite! Como posso te ajudar?"},
              {"role": "user", "content": "Estou a procura de um ipad"},
              {"role": "user", "content": "10 ou 11"},
          ]
          ipad_decision = asyncio.run(
              ipad_service.respond("Semi novo", history=ipad_history)
          )
          assert not ipad_decision.handoff, ipad_decision
          assert ipad_decision.product_references == [], ipad_decision
          assert ipad_decision.image_urls == [], ipad_decision
          assert "iPad 10" in ipad_decision.reply, ipad_decision.reply
          assert "iPad 11 A16" in ipad_decision.reply, ipad_decision.reply
          assert "NOVO LACRADO" in ipad_decision.reply.upper(), ipad_decision.reply
          assert "IPHONE" not in ipad_decision.reply.upper(), ipad_decision.reply
          assert "SEMINOVOS DISPONÍVEIS PARA VENDA" not in ipad_decision.reply.upper()
          print("IPAD_SEMINOVO_OFFERS_NEW_IPADS_OK")
          PY
          docker compose --env-file .env.local exec -T app python - <<'PY'
