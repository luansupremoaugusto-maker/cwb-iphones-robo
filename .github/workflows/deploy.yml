name: Deploy VPS

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy tested commit to VPS
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/cwb_iphones_actions"
          chmod 600 "$HOME/.ssh/cwb_iphones_actions"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy the tested commit
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/cwb_iphones_actions" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/cwb-iphones
          git fetch origin main
          test -z "$(git status --porcelain --untracked-files=no)"
          latest_main_sha="$(git rev-parse origin/main)"
          if [[ "$DEPLOY_SHA" != "$latest_main_sha" ]]; then
            echo "Skipping stale Tests result $DEPLOY_SHA; current main is $latest_main_sha"
            exit 0
          fi
          git checkout --detach "$DEPLOY_SHA"
          active_vps_sha="$(git rev-parse HEAD)"
          test "$active_vps_sha" = "$DEPLOY_SHA"
          printf 'Active VPS SHA: %s\n' "$active_vps_sha"

          if grep -q '^OPENAI_MODEL=' .env.local; then
            sed -i 's/^OPENAI_MODEL=.*/OPENAI_MODEL=gpt-6-luna/' .env.local
          else
            printf '\nOPENAI_MODEL=gpt-6-luna\n' >> .env.local
          fi

          if grep -q '^OPENAI_REASONING_EFFORT=' .env.local; then
            sed -i 's/^OPENAI_REASONING_EFFORT=.*/OPENAI_REASONING_EFFORT=medium/' .env.local
          else
            printf '\nOPENAI_REASONING_EFFORT=medium\n' >> .env.local
          fi

          docker compose --env-file .env.local config --quiet
          git fetch origin main
          latest_main_sha="$(git rev-parse origin/main)"
          if [[ "$DEPLOY_SHA" != "$latest_main_sha" ]]; then
            echo "Skipping stale deployment $DEPLOY_SHA; current main is $latest_main_sha"
            exit 0
          fi
          docker compose --env-file .env.local up -d --build
          docker compose --env-file .env.local ps
          docker compose --env-file .env.local exec -T app python -c 'import asyncio; from app.adapters.mercado_phone import InventoryCache; from app.agent import AgentService; from app.config import Settings; from app.faq import FAQStore; from app.trade_in import TRADE_IN_FORM, is_parts_buyback_request, is_trade_in_request; settings = Settings(openai_api_key=None, google_sheets_enabled=False); service = AgentService(InventoryCache(object(), settings, cache_path="/tmp/iphone-13-replaced-components.json"), FAQStore(settings.faq_file), settings, offline=True); history = [{"role": "user", "content": "oi"}, {"role": "assistant", "content": "Cwb.iphones agradece seu contato. Como podemos ajudar?"}, {"role": "user", "content": "tudo bem?"}, {"role": "assistant", "content": "Oi! Tudo bem? 😊 Como posso te ajudar?"}]; text = "queria ver\nse vocês pegam troca\no meu é o 13\nmas tem a bateria e a tela trocada..."; decision = asyncio.run(service.respond(text, history=history)); assert is_trade_in_request(text); assert not is_parts_buyback_request(text); assert decision.reply == TRADE_IN_FORM and decision.handoff and decision.product_references == [] and decision.image_urls == []; print("iPhone 13 replaced battery/screen evaluation routing: ok")'
          for service in app worker; do
            effective_model="$(docker compose --env-file .env.local exec -T "$service" python -c 'from app.config import Settings; print(Settings().openai_model)')"
            test "$effective_model" = "gpt-6-luna"
            printf 'OpenAI model (%s): %s\n' "$service" "$effective_model"
            effective_effort="$(docker compose --env-file .env.local exec -T "$service" python -c 'from app.config import Settings; print(Settings().openai_reasoning_effort)')"
            test "$effective_effort" = "medium"
            printf 'OpenAI reasoning effort (%s): %s\n' "$service" "$effective_effort"
          done
          docker compose --env-file .env.local exec -T app python -c 'from app.adapters.catalog_cache import _requested_iphone_model_keys; query = "Tem algum iPhone 17 usado? Ou 16 pro usado"; expected = ((17, ""), (16, "pro")); actual = _requested_iphone_model_keys(query); assert actual == expected, actual; print("iPhone 17/16 Pro alternatives: ok")'
          docker compose --env-file .env.local exec -T app python -c 'from app.adapters.catalog_cache import _requested_iphone_model_keys; from app.agent import _multi_model_installment_queries; query = "O 16 pro semi-novo 100% e o 17 pro Max lacrado de 256"; expected_models = ((16, "pro"), (17, "pro max")); expected_queries = ("o 16 pro semi-novo 100%", "o 17 pro max lacrado de 256"); models = _requested_iphone_model_keys(query); queries = _multi_model_installment_queries(query, []); assert models == expected_models, models; assert queries == expected_queries, queries; print("Two-model installment scopes: ok")'
          docker compose --env-file .env.local exec -T app python -c 'from app.trade_in import is_parts_buyback_request, is_trade_in_request; query = "Por quanto vocês pegam 14 pro Max roxo, 83% a bateria e 128gb? Quero trocar pelo 16 pro Max"; assert is_trade_in_request(query); assert not is_parts_buyback_request(query); print("iPhone 14 Pro Max trade-up evaluation routing: ok")'
          docker compose --env-file .env.local exec -T app python -c 'import asyncio; from app.adapters.mercado_phone import InventoryCache; from app.agent import AgentService; from app.config import Settings; from app.faq import FAQStore; from app.trade_in import TRADE_IN_FORM, is_parts_buyback_request, is_trade_in_request; settings = Settings(openai_api_key=None, google_sheets_enabled=False); service = AgentService(InventoryCache(object(), settings, cache_path="/tmp/ipad-11-evaluation-guard.json"), FAQStore(settings.faq_file), settings, offline=True); query = "Tenho um iPad 11 A16 com 3/4 meses de uso. Gostaria de vendê-lo, ainda está na garantia. Mas usei muito pouco e não me fez útil. Sem detalhes."; history = [{"role": "user", "content": "Boa tarde"}, {"role": "assistant", "content": "Cwb.iphones agradece seu contato. Como podemos ajudar?"}, {"role": "assistant", "content": "Boa tarde! 😊 Como posso te ajudar?"}]; decision = asyncio.run(service.respond(query, history=history)); assert is_trade_in_request(query); assert not is_parts_buyback_request(query); assert decision.reply == TRADE_IN_FORM; assert decision.handoff; assert decision.product_references == []; assert decision.image_urls == []; refusal = "Tenho um iPad, mas não gostaria de vendê-lo."; refusal_decision = asyncio.run(service.respond(refusal)); assert not is_trade_in_request(refusal); assert refusal_decision.reply != TRADE_IN_FORM; assert not refusal_decision.handoff; print("iPad 11 sale and negated-sale evaluation routing: ok")'
          docker compose --env-file .env.local exec -T app python -c 'from app.trade_in import is_parts_buyback_request, is_trade_in_request; query = "To querendo mes que vem troca de celular e to fazendo uma pesquisa. Voces pegam celular e se sim eu tenho um 15 pro Max. Saude da bateria 82%. Eu estou querendo 17 pro ou 17 pro Max, menos o laranja, quanto sairia a diferenca. Se fosse no pix qual e a diferenca e se fosse no credito como funciona a parcela"; assert is_trade_in_request(query); assert not is_parts_buyback_request(query); repair = "Tenho um iPhone 15 Pro e estou querendo um 17 Pro; quanto custa trocar a bateria do 15?"; assert not is_trade_in_request(repair); print("iPhone 15 Pro Max upgrade and battery-repair routing: ok")'
          docker compose --env-file .env.local exec -T app python -c 'import asyncio; from app.adapters.mercado_phone import InventoryCache; from app.agent import AgentService; from app.config import Settings; from app.faq import FAQStore; settings = Settings(openai_api_key=None, google_sheets_enabled=False); service = AgentService(InventoryCache(object(), settings, cache_path="/tmp/iphone-battery-condition-guard.json"), FAQStore(settings.faq_file), settings, offline=True); decision = asyncio.run(service.respond("Boa tarde! Esse iPhone 16 pro, a bateria dele é trocada?")); assert decision.handoff and "dúvida" in decision.reply.lower() and "assistência técnica" not in decision.reply.lower() and decision.product_references == [] and decision.image_urls == [], decision; repair = asyncio.run(service.respond("Quanto custa trocar a bateria desse iPhone?")); assert repair.handoff and "assistência técnica" in repair.reply.lower(), repair; print("IPHONE_BATTERY_CONDITION_ROUTING_OK")'
          docker compose --env-file .env.local exec -T app python -c 'from app.trade_in import is_parts_buyback_request, is_trade_in_context_request, is_trade_in_request; offer = "bom dia, estou fazendo uma pesquisa de valores, qual o melhor valor que voce consegue fazer para troca de 2 17 pro max 256 (prata e azul) garantia novembro por 2 18 pro max 256 (prata e preto)"; history = [{"role": "user", "content": offer}, {"role": "assistant", "content": "Produtos novos lacrados têm garantia de 1 ano pela Apple."}]; followup = "sim, o meu 17 ta com garantia novembro"; assert is_trade_in_request(offer); assert not is_parts_buyback_request(offer); assert is_trade_in_context_request(followup, history); print("Two-iPhone upgrade evaluation routing: ok")'
          docker compose --env-file .env.local exec -T app python -c 'from app.trade_in import is_trade_in_context_request; history = [{"role": "assistant", "content": "Encontrei iPhone 15 disponível no catálogo por R$ 2.890."}, {"role": "user", "content": "Eu tenho um 13 aceita na troca"}]; text = "Como parte de apagamento"; assert is_trade_in_context_request(text, history); print("Bare iPhone exchange evaluation routing: ok")'
          docker compose --env-file .env.local exec -T app python -c 'from app.trade_in import is_trade_in_context_request; history = [{"role": "user", "content": "Qual valor do 18 pro Max"}, {"role": "assistant", "content": "Encontrei estas opções de iPhone 18 Pro Max disponíveis por R$ 11.100,00."}]; offer = "Pega 17 pro Max por quantos"; assert is_trade_in_context_request(offer, history); assert not is_trade_in_context_request("Qual o valor do iPhone 17 Pro Max de 256 GB?", history); print("iPhone 17 buyback price follow-up: ok")'
          docker compose --env-file .env.local exec -T app python -c 'import asyncio; from app.adapters.mercado_phone import InventoryCache; from app.agent import AgentService; from app.config import Settings; from app.faq import FAQStore; settings = Settings(openai_api_key=None, google_sheets_enabled=False); service = AgentService(InventoryCache(object(), settings, cache_path="/tmp/iphone-13-evaluation-guard.json"), FAQStore(settings.faq_file), settings, offline=True); history = [{"role": "assistant", "content": "Encontrei estas opções de IPHONE 16 PRO disponíveis: 128GB, SEMINOVO, R$ 4.320,00, bateria 100%."}]; text = "Tenho um 13 branco, sem marca de uso, 128g com 88% de bateria, por quanto vocês compram?"; decision = asyncio.run(service.respond(text, history=history)); assert decision.handoff and "favor preencher lista de avaliação" in decision.reply.lower() and decision.product_references == [] and decision.image_urls == []; print("iPhone 13 complete-device buyback evaluation: ok")'
          docker compose --env-file .env.local exec -T app python -c 'from app.agent import _customer_product_condition_context_query, _customer_product_request_context_query, _is_pronta_entrega_only_request; history = [{"role": "user", "content": "Estou procurando um iPhone novo ou semi para compra. Quais modelos você tem a pronta entrega? 15/16/17. Novo ou semi."}]; current = "E novo?"; condition = _customer_product_condition_context_query(current, history); context = _customer_product_request_context_query(current, history); assert condition == current, condition; assert _is_pronta_entrega_only_request(context), context; print("New-condition pronta-entrega follow-up: ok")'
          docker compose --env-file .env.local exec -T app python -c 'from app.agent import _is_contextual_pronta_entrega_followup, _is_delivery_or_pickup_request; history = [{"role": "assistant", "content": "Ouro-rosa está cadastrado para o Apple Watch Series 11 nos dois tamanhos: 42 mm por R$ 2.500 ou 46 mm por R$ 2.700. Trabalhamos por encomenda, com prazo de 1 semana. Qual tamanho você prefere?"}]; text = "Nenhum a pronta entrega?"; assert _is_contextual_pronta_entrega_followup(text, history); assert not _is_delivery_or_pickup_request(text, history); print("APPLE_WATCH_READY_STOCK_CONTEXT_GUARD_OK")'
          docker compose --env-file .env.local exec -T app python -c 'from app.agent import _is_store_hours_request; query = "até q hrs vcs ficam abertos?"; assert _is_store_hours_request(query); print("STORE_HOURS_SHORTHAND_GUARD_OK")'
          docker compose --env-file .env.local exec -T app python -c '
          import asyncio
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import app.agent as agent_module
          from app.adapters.mercado_phone import InventoryCache
          from app.agent import AgentService
          from app.config import Settings
          from app.faq import FAQStore

          agent_module._store_now = lambda: datetime(
              2026, 10, 6, 10, 0, tzinfo=ZoneInfo("America/Sao_Paulo")
          )
          settings = Settings(openai_api_key=None, google_sheets_enabled=False)
          service = AgentService(
              InventoryCache(
                  object(),
                  settings,
                  cache_path="/tmp/visit-booking-after-catalog.json",
              ),
              FAQStore(settings.faq_file),
              settings,
              offline=True,
          )
          history = [
              {
                  "role": "user",
                  "content": (
                      "To interessaaado no Iphone 14 Pro Max ou 16 Pro max. "
                      "Ainda na hora vou decidir se os dois ainda estiverem disponíveis."
                  ),
              },
              {
                  "role": "assistant",
                  "content": (
                      "Entendi! No momento, temos seminovos disponíveis dos dois modelos: "
                      "iPhone 14 Pro Max (128 GB e 256 GB) e iPhone 16 Pro Max "
                      "(256 GB e 512 GB). A disponibilidade pode mudar até o dia da visita. "
                      "Quando definir o dia e o horário, é só me avisar."
                  ),
              },
          ]
          decision = asyncio.run(
              service.respond(
                  "Ta corrido essa semana ahahaha, podemos marcar na sexta as 09h?",
                  history=history,
              )
          )
          assert (
              decision.handoff
              and "agendamento" in (decision.handoff_reason or "").lower()
          ), decision
          assert decision.product_references == [], decision
          assert decision.image_urls == [], decision
          assert "r$ 9,00" not in decision.reply.lower(), decision.reply
          print("VISIT_BOOKING_AFTER_CATALOG_OK")
          '
          docker compose --env-file .env.local exec -T app python -c 'from datetime import timedelta; from app.agent import _is_today_store_status_request; from app.processor import AGENT_CONTEXT_WINDOW; assert AGENT_CONTEXT_WINDOW == timedelta(hours=12); assert _is_today_store_status_request("Hoje você trabalha?"); assert _is_today_store_status_request("Vocês trabalham hoje?"); assert not _is_today_store_status_request("Eu trabalho hoje?"); print("Conversation topic and store-status guards: ok")'
          docker compose --env-file .env.local exec -T app python -c 'from app.agent import _is_unresolved_iphone_model_selection; generic = "Tenho um modelo em mente de iPhone que quero comprar lacrado"; specific = "Quero comprar iPhone 16 lacrado"; assert _is_unresolved_iphone_model_selection(generic); assert not _is_unresolved_iphone_model_selection(specific); print("Unspecified iPhone model clarification: ok")'
          docker compose --env-file .env.local exec -T app python -c '
          import asyncio
          from types import SimpleNamespace
          from app.agent import AgentService
          from app.config import Settings
          from app.faq import FAQStore
          from app.installments import simulate_installment_table

          class InstallmentGuardCache:
              async def search(self, query, limit=10):
                  return []

              async def simulate_all_installments(self, query):
                  normalized = query.rstrip().lower()
                  if normalized.endswith("seminovo"):
                      return simulate_installment_table(SimpleNamespace(name="iPhone 16", capacity="128 GB", price_brl=3750.0))
                  if normalized.endswith("lacrado"):
                      return simulate_installment_table(SimpleNamespace(name="iPhone 16", capacity="128 GB", price_brl=4900.0))
                  return {"encontrado": False, "ambiguo": True, "candidatos": [
                      {"nome": "iPhone 16", "capacidade": "128 GB", "condicao": "seminovo", "saude_bateria": 90},
                      {"nome": "iPhone 16", "capacidade": "128 GB", "condicao": "novo lacrado", "saude_bateria": None},
                  ]}

          settings = Settings(openai_api_key=None, google_sheets_enabled=False)
          service = AgentService(InstallmentGuardCache(), FAQStore(settings.faq_file), settings, offline=True)
          history = [{"role": "assistant", "content": "Encontrei o iPhone 16 de 128 GB seminovo por R$ 3.750,00 e novo lacrado por R$ 4.900,00."}]
          decision = asyncio.run(service.respond("Como funciona o parcelamento do iPhone 16 de 128 GB ?", history=history))
          assert not decision.handoff, decision
          assert decision.product_references == [], decision.product_references
          assert "Preço à vista: R$ 3.750,00" in decision.reply, decision.reply
          assert "Preço à vista: R$ 4.900,00" in decision.reply, decision.reply
          assert decision.reply.count(chr(10) + "1x de") == 2, decision.reply
          assert decision.reply.count(chr(10) + "18x de") == 2, decision.reply
          assert "256 GB" not in decision.reply, decision.reply
          print("iPhone 16 128 GB installment routing: ok")
          '
          docker compose --env-file .env.local exec -T app python -c '
          import asyncio
          from app.agent import AgentService, _normalize
          from app.config import Settings
          from app.faq import FAQStore

          class EmptyInventoryCache:
              async def search(self, query, limit=10):
                  return []

          settings = Settings(openai_api_key=None, google_sheets_enabled=False)
          agent = AgentService(
              EmptyInventoryCache(),
              FAQStore(settings.faq_file),
              settings,
              offline=True,
          )
          question = "E como pago a entrega e o celular?"
          initial = asyncio.run(agent.respond(question))
          initial_reply = _normalize(initial.reply)
          assert not initial.handoff, initial
          assert "antecipado antes do despacho" in initial_reply, initial.reply
          assert "nao e possivel pagar na entrega" in initial_reply, initial.reply
          assert "maquina fisica" in initial_reply, initial.reply
          history = [
              {"role": "user", "content": question},
              {"role": "assistant", "content": initial.reply},
          ]
          unable_to_visit = asyncio.run(
              agent.respond("Não consigo ir até a loja, não dá tempo", history=history)
          )
          unable_reply = _normalize(unable_to_visit.reply)
          assert not unable_to_visit.handoff, unable_to_visit
          assert "visita" not in unable_reply and "qual horario" not in unable_reply, unable_to_visit
          address = asyncio.run(agent.respond("Bacacheri, Curitiba", history=history))
          address_reply = _normalize(address.reply)
          assert address.handoff, address
          assert "atendente" in address_reply and "taxa" in address_reply, address.reply
          assert "prazo" in address_reply and "pagamento" in address_reply, address.reply
          confirmation = asyncio.run(agent.respond("Sim, pode ser", history=history))
          assert not confirmation.handoff, confirmation
          question_about_city = asyncio.run(
              agent.respond("Vocês entregam em Curitiba?", history=history)
          )
          assert not question_about_city.handoff, question_about_city
          print("DELIVERY_PAYMENT_AND_ADDRESS_HANDOFF_OK")
          '
          curl -fsS https://bot.cwbiphones.cloud/ready
          curl -fsS https://bot.cwbiphones.cloud/health
          REMOTE
