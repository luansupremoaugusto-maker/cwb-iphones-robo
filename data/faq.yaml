address: "Avenida Nossa Senhora da Luz, 1341 - Jardim Social, Curitiba - PR, 82520-060"
physical_store: "Sim, temos loja física na Avenida Nossa Senhora da Luz, 1341 - Jardim Social, Curitiba - PR, 82520-060. Atendemos de segunda a sexta, das 09:00 às 18:00. Aos sábados, domingos e feriados, a loja fica fechada. O atendimento é feito com horário marcado."
hours: "Segunda a sexta, das 09:00 às 18:00. Sábados, domingos e feriados: fechado."
delivery: "Enviamos para Curitiba e região por motoboy. Para fora de Curitiba, enviamos por Sedex. O pagamento deve ser antecipado antes do despacho. Taxa e prazo devem ser cotados com um atendente."
pickup: "Fazemos retirada na loja com horário marcado. O pagamento é feito na hora da retirada."
payment: "Aceitamos PIX, dinheiro, cartão de débito e cartão de crédito. PIX, dinheiro e cartão de débito têm pagamento integral à vista, sem taxas. O cliente pode pagar a mesma compra usando mais de um cartão de crédito, se desejar. O cartão de crédito pode ser parcelado em até 18 vezes na máquina física. Não parcelamos no boleto ou PIX e não aceitamos cartão Senff."
warranty: "Produtos seminovos têm garantia de 90 dias. Produtos novos e lacrados têm garantia de 1 ano pela Apple."
invoice: "Podemos emitir nota fiscal para todos os produtos, sejam seminovos ou lacrados."
returns: "Trocas e devoluções devem ser verificadas com um atendente."
accessories: "Aparelhos seminovos acompanham cabo e fonte novos, homologados pela Anatel. Se quiser, conseguimos capinha, película e protetor de câmera por R$ 10,00 cada. Aparelhos novos lacrados acompanham apenas o cabo original que já vem dentro da caixa."
buyback: "Sim, compramos produtos da marca Apple, mediante avaliação. Vou enviar a lista de avaliação para preenchimento e encaminhar o atendimento para um atendente."

